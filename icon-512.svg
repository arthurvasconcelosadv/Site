<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D1B2A"/>
      <stop offset="100%" stop-color="#1A2F45"/>
    </linearGradient>
    <filter id="shadow512">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#C9A84C" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg512)"/>

  <!-- Subtle radial glow -->
  <radialGradient id="glow512" cx="70%" cy="30%" r="50%">
    <stop offset="0%"   stop-color="#C9A84C" stop-opacity="0.1"/>
    <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="96" fill="url(#glow512)"/>

  <!-- Balance Scale — centered, gold -->
  <g transform="translate(256,256)" filter="url(#shadow512)">
    <!-- Horizontal beam -->
    <rect x="-160" y="-90" width="320" height="18" rx="9" fill="#C9A84C"/>

    <!-- Center pillar -->
    <rect x="-12" y="-90" width="24" height="200" rx="12" fill="#C9A84C"/>

    <!-- Base -->
    <rect x="-80" y="110" width="160" height="18" rx="9" fill="#C9A84C"/>
    <rect x="-36" y="128" width="72" height="14" rx="7" fill="#C9A84C"/>

    <!-- Center pivot circle -->
    <circle cx="0" cy="-90" r="18" fill="#C9A84C"/>
    <circle cx="0" cy="-90" r="10" fill="#0D1B2A"/>

    <!-- Left pan ropes -->
    <line x1="-120" y1="-72" x2="-120" y2="20" stroke="#C9A84C" stroke-width="8" stroke-linecap="round"/>
    <line x1="-60"  y1="-72" x2="-60"  y2="20" stroke="#C9A84C" stroke-width="8" stroke-linecap="round"/>

    <!-- Left pan -->
    <path d="M-148 20 Q-90 56 -32 20" stroke="#C9A84C" stroke-width="10" fill="none" stroke-linecap="round"/>

    <!-- Right pan ropes -->
    <line x1="60"  y1="-72" x2="60"  y2="20" stroke="#C9A84C" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="-72" x2="120" y2="20" stroke="#C9A84C" stroke-width="8" stroke-linecap="round"/>

    <!-- Right pan -->
    <path d="M32 20 Q90 56 148 20" stroke="#C9A84C" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Gold frame accent (corners) -->
  <rect x="20" y="20" width="60" height="6" rx="3" fill="#C9A84C" opacity="0.4"/>
  <rect x="20" y="20" width="6" height="60" rx="3" fill="#C9A84C" opacity="0.4"/>
  <rect x="432" y="20" width="60" height="6" rx="3" fill="#C9A84C" opacity="0.4"/>
  <rect x="486" y="20" width="6" height="60" rx="3" fill="#C9A84C" opacity="0.4"/>
  <rect x="20" y="486" width="60" height="6" rx="3" fill="#C9A84C" opacity="0.4"/>
  <rect x="20" y="432" width="6" height="60" rx="3" fill="#C9A84C" opacity="0.4"/>
  <rect x="432" y="486" width="60" height="6" rx="3" fill="#C9A84C" opacity="0.4"/>
  <rect x="486" y="432" width="6" height="60" rx="3" fill="#C9A84C" opacity="0.4"/>
</svg>
