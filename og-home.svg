  <text x="96" y="450" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.65)" font-weight="400">Defesa dos direitos do trabalhador · Atendimento online para todo o Brasil</text>

  <!-- Divider -->
  <rect x="96" y="478" width="80" height="3" rx="1.5" fill="#C9A84C"/>

  <!-- Stats row -->
  <text x="96"  y="530" font-family="Georgia, serif" font-size="28" font-weight="900" fill="#C9A84C">+500</text>
  <text x="96"  y="552" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">Clientes</text>
  <text x="240" y="530" font-family="Georgia, serif" font-size="28" font-weight="900" fill="#C9A84C">98%</text>
  <text x="240" y="552" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">Êxito</text>
  <text x="360" y="530" font-family="Georgia, serif" font-size="28" font-weight="900" fill="#C9A84C">10+</text>
