    <rect x="97" y="0" width="6" height="120" rx="3" fill="#C9A84C"/>
    <rect x="62" y="120" width="76" height="6" rx="3" fill="#C9A84C"/>
    <circle cx="100" cy="0" r="8" fill="#C9A84C"/>
    <line x1="20"  y1="4"  x2="20"  y2="55" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
    <line x1="50"  y1="4"  x2="50"  y2="55" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
    <path d="M10 55 Q35 72 60 55" stroke="#C9A84C" stroke-width="4" fill="none" stroke-linecap="round"/>
    <line x1="150" y1="4"  x2="150" y2="55" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
    <line x1="180" y1="4"  x2="180" y2="55" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
    <path d="M140 55 Q165 72 190 55" stroke="#C9A84C" stroke-width="4" fill="none" stroke-linecap="round"/>
