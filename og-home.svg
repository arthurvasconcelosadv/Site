  <rect x="0" y="598" width="1200" height="32" fill="rgba(201,168,76,0.08)"/>
  <text x="600" y="619" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.35)" letter-spacing="2">arthurvasconcelos.adv.br</text>
