  <text x="940" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#25D366" letter-spacing="1">CONSULTA GRATUITA</text>
  <text x="940" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="900" fill="white">(34) 99999-9999</text>
  <text x="940" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)">WhatsApp · Resposta no mesmo dia</text>

