  <text x="246" y="182" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#C9A84C" letter-spacing="3">UBERLÂNDIA · BRASIL</text>

  <!-- Main headline -->
  <text x="96" y="258" font-family="Georgia, 'Playfair Display', serif" font-size="58" font-weight="900" fill="white" letter-spacing="-1">Advogado</text>
  <text x="96" y="330" font-family="Georgia, 'Playfair Display', serif" font-size="58" font-weight="900" fill="white" letter-spacing="-1">Trabalhista</text>

