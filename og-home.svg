  <rect x="760" y="396" width="200" height="40" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="860" y="422" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.45)" font-weight="700" letter-spacing="1">OAB/MG · [Nº]</text>

