<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#0D1B2A"/>

  <!-- Balance beam top bar -->
  <rect x="12" y="18" width="40" height="3" rx="1.5" fill="#C9A84C"/>

  <!-- Center pillar -->
  <rect x="30.5" y="18" width="3" height="26" rx="1.5" fill="#C9A84C"/>

  <!-- Base -->
  <rect x="22" y="44" width="20" height="3" rx="1.5" fill="#C9A84C"/>
  <rect x="28" y="47" width="8" height="2" rx="1" fill="#C9A84C"/>

  <!-- Left pan rope -->
  <line x1="14" y1="21" x2="14" y2="32" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="21" x2="20" y2="32" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Left pan -->
  <path d="M11 32 Q17 36 23 32" stroke="#C9A84C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Right pan rope -->
  <line x1="44" y1="21" x2="44" y2="32" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="21" x2="50" y2="32" stroke="#C9A84C" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Right pan -->
  <path d="M41 32 Q47 36 53 32" stroke="#C9A84C" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Center pivot dot -->
  <circle cx="32" cy="18" r="2.5" fill="#C9A84C"/>
</svg>
